version: 1
# env: staging-self —— 云内网预发环境期望态骨架（IR-0006 W1-C2 / IFACE-05）
# R3 对账范围=dev/staging 先行，prod 不在检测面（IR#402 旋钮：首个托管客户前写死责任边界）。
name: staging-self
scope: declared-only（骨架；实况上报与对账 W4-R1 落地）
topology:
  anchor: public-server
  workers:
    - cloud-desktop-pool（staging 分区 owner-fill）
  secret_store: vault
  llm_route: llm-router
images:
  runtime: owner-fill（staging 基础镜像 pin @sha256）
network:
  egress_allowlist:
    - api.github.com
    - LLM endpoint（owner-fill 域名）
  ingress: none
secrets:
  - ref: vault:<path owner-fill>/staging-credentials
resources:
  worker_count: owner-fill
  quota_note: staging 与 dev 共享池时须分区计量（tenant tag 区分）
tenants:
  - cloudbird
